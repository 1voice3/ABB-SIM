<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ACH180 Sim">
<meta name="theme-color" content="#dfe3e6"><title>ACH180 VFD Simulator</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="style.css"></head>
<body>
<header><b>ACH180</b> HVAC drive trainer<small>Unofficial study tool. Not affiliated with ABB.</small></header>
<main>
<section id="panel">
 <div class="drive"><div class="lcdwrap"><pre id="lcd"></pre><span id="led" class="led off"></span></div>
 <div class="keys">
  <button data-k="bk" class="k">Back</button><button data-k="u" class="k">▲</button><button data-k="ok" class="k ok">OK</button>
  <button data-k="l" class="k">◀</button><button data-k="d" class="k">▼</button><button data-k="r" class="k">▶</button>
  <button data-k="off" class="k off">Off</button><span></span><button data-k="ah" class="k ah">Auto/Hand</button></div></div>
 <div id="stat" class="stat"></div><p id="warn" class="warnline"></p>
 <p class="n">Press OK on the Home view for the Menu, Back for Options. On the real drive the panel layout is in the firmware manual, chapter Control panel.</p>
</section>
<section id="wiring" hidden></section>
<section id="params" hidden><input id="q" type="search" placeholder="Search parameters" autocomplete="off"><div id="plist"></div></section>
<section id="faults" hidden></section>
<section id="study" hidden></section>
</main>
<div id="sheet" hidden></div>
<nav><button data-tab="panel" class="on">Panel</button><button data-tab="wiring">Wiring</button><button data-tab="params">Params</button><button data-tab="faults">Faults</button><button data-tab="study">Study</button></nav>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
